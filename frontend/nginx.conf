limit_req_zone $binary_remote_addr zone=health_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { try_files /index.html =404; }
    # The admin application and every API-key-bearing request are intentionally
    # unavailable on the public HTTP listener.
    location = /admin { return 404; }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # URL creation is the only public API operation. Management and analytics
    # are served only by the loopback-bound listener below.
    location = /api/v1/urls {
        if ($request_method != POST) { return 404; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ { return 404; }
    location ^~ /health/ {
        limit_req zone=health_limit burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location ^~ /docs/ { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # Only URL-safe, single-segment paths are eligible short codes. Everything
    # else is a 404, preventing accidental SPA routes from becoming redirects.
    location ~ "^/[A-Za-z0-9_-]{3,32}$" {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}

# This listener is published on the Docker host's loopback interface only.
# Reach it remotely with an encrypted SSH tunnel; it is never Internet-facing.
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = / { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location ^~ /assets/ { try_files $uri =404; expires 1y; }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location ^~ /docs/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location ~ "^/[A-Za-z0-9_-]{3,32}$" {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
